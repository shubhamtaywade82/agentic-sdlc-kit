# Baseline CI for the Agentic SDLC Kit (release 0.1).
#
# SECURITY.md §6: GitHub Actions are pinned to full SHAs (not @v4) to
# defend against supply-chain tampering of the action ref. The SHAs below
# are the v4 tags of actions/checkout and actions/setup-node at the time
# this file was authored; they should be re-verified at every release and
# updated only after a recorded review (M16 hardens this further).
#
# The matrix runs on Ubuntu and macOS, against Node 20 and Node 22, which
# are the LTS lines we support (REQUIREMENTS.md NFR-2.1).
#
# Pipeline:
#   install (frozen-lockfile) → architecture check → typecheck → lint →
#   test → build → CLI smoke → mods (claude plugin validate) →
#   fixture smoke (Node kit verify) → fixture ruby (Ruby kit verify) →
#   fixture rails (Rails kit verify) → live agent (main, keyed)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - name: Checkout
        # Pin: actions/checkout@v4 → SHA at tag v4.2.2.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # Pin: pnpm/action-setup@v4 → SHA at tag v4.0.0.
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 12.21.0

      - name: Setup Node ${{ matrix.node }}
        # Pin: actions/setup-node@v4 → SHA at tag v4.1.0.
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Architecture check
        run: pnpm run check:architecture

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: CLI smoke (`kit --version`)
        run: node packages/cli/dist/index.js --version

      - name: CLI smoke (`kit --help`)
        run: node packages/cli/dist/index.js --help

      - name: CLI smoke (`kit doctor`)
        run: node packages/cli/dist/index.js doctor

  shellcheck:
    name: shellcheck (any shell scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run shellcheck
        # Find any shell scripts we ship; in 0.1 there are none under
        # packages/ but we keep the gate so later milestones do not regress.
        run: |
          set -e
          if find scripts packages -name "*.sh" -type f -print -quit | grep -q .; then
            shellcheck $(find scripts packages -name "*.sh" -type f)
          else
            echo "No shell scripts to check."
          fi

  mods:
    # The Mods' own static check (code.claude.com/docs/en/plugins/mods).
    # Mods need Claude Code 2.1.287 or newer. 2.1.319 was the newest release
    # at least two weeks old when pinned. Bump on purpose. No API key needed.
    # `claude plugin test` is not run here: these Mods' tests use Vitest and
    # the kit's MockRuntime, and already run in the verify job.
    name: mods (claude plugin validate)
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.319
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'

      - name: Install the pinned Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" && claude --version

      - name: Validate each Mod
        run: |
          set -e
          for dir in plugins/*/; do
            echo "::group::claude plugin validate ${dir}"
            claude plugin validate "${dir}"
            echo "::endgroup::"
          done

  fixture-smoke:
    name: fixture smoke (kit verify on the committed Node fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 12.21.0

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy fixture out of the repository
        run: cp -R fixtures/fixture-node-fullstack "$RUNNER_TEMP/fixture"

      - name: kit verify on the copied fixture
        run: node packages/cli/dist/index.js verify "$RUNNER_TEMP/fixture"

  fixture-ruby:
    # Exercises the `ruby` stack pack end to end against a real `bundle exec
    # rspec` run, proving the verification classifier recognizes RSpec output
    # (ADR-0018 P1). Mirrors `fixture-smoke` but swaps the Node toolchain for
    # Ruby + bundler. Actions are pinned to full SHAs (SECURITY.md §6).
    name: fixture ruby (kit verify on the committed Ruby fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 12.21.0

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: pnpm

      - name: Install and build the kit
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy fixture out of the repository
        run: cp -R fixtures/fixture-ruby-rspec "$RUNNER_TEMP/fixture"

      - name: Setup Ruby and install gems
        # Pin: ruby/setup-ruby@v1 → SHA at tag v1.222.0.
        uses: ruby/setup-ruby@277ba2a127aba66d45bad0fa2dc56f80dbfedffa
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ runner.temp }}/fixture

      - name: kit verify on the copied Ruby fixture
        run: node packages/cli/dist/index.js verify "$RUNNER_TEMP/fixture"

  fixture-rails:
    # Exercises the `ruby-rails` stack pack end to end: a real Rails 8 API
    # app boots, `db:prepare` loads the schema, and `bundle exec rspec` runs
    # inside the booted Rails environment (rspec-rails). Proves the evidence
    # gate and the RSpec classifier against Rails-shaped output. Mirrors
    # `fixture-ruby` with an added schema-load step. Actions pinned to full
    # SHAs (SECURITY.md §6).
    name: fixture rails (kit verify on the committed Rails fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 12.21.0

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: pnpm

      - name: Install and build the kit
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy fixture out of the repository
        run: cp -R fixtures/fixture-rails-api "$RUNNER_TEMP/fixture"

      - name: Setup Ruby and install gems
        # Pin: ruby/setup-ruby@v1 → SHA at tag v1.222.0.
        uses: ruby/setup-ruby@277ba2a127aba66d45bad0fa2dc56f80dbfedffa
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ runner.temp }}/fixture

      - name: Prepare the test database
        # Loads db/schema.rb into storage/test.sqlite3 so maintain_test_schema!
        # in rails_helper.rb passes and the model spec's table exists.
        working-directory: ${{ runner.temp }}/fixture
        run: bundle exec rails db:prepare RAILS_ENV=test

      - name: kit verify on the copied Rails fixture
        run: node packages/cli/dist/index.js verify "$RUNNER_TEMP/fixture"

  live-agent:
    # Runs only on main pushes, and only when the secret exists. Forks and
    # pull requests never receive the key, so this job is skipped there.
    name: live agent (real claude provider smoke test)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check whether the key is configured
        id: gate
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "ANTHROPIC_API_KEY not set; live lane skipped"; fi

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 12.21.0

      - name: Setup Node 22
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: pnpm

      - name: Install the pinned Claude Code CLI
        if: steps.gate.outputs.enabled == 'true'
        # 2.1.319: newest release at least two weeks old when this was pinned.
        run: npm install -g @anthropic-ai/claude-code@2.1.319 && claude --version

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the real-provider smoke test
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm --filter @agentic-sdlc-kit/cli exec vitest run src/application/agent/providers/claude-code/claude-code-smoke.test.ts
