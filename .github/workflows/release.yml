# Release and publish workflow for the Agentic SDLC Kit.
#
# SECURITY.md §6: GitHub Actions are pinned to full SHAs (not @v4) to
# defend against supply-chain tampering of the action ref.
#
# Triggers:
#   - Pushing a release tag (e.g., v0.9.1)
#   - Publishing a GitHub Release
#   - Manual trigger (workflow_dispatch) with optional dry_run flag

name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify and simulate publish without writing to npm)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pin: actions/checkout@v7.0.1 (targets node24).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # Pin: pnpm/action-setup@v6.1.1 (targets node24).
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d
        with:
          version: 12.21.0

      - name: Setup Node 22
        # Pin: actions/setup-node@v7.1.0 (targets node24).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full verification (architecture, milestones, build, lint, typecheck, test)
        run: pnpm run verify

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running dry-run publish..."
            pnpm -r --filter "./packages/*" publish --access public --dry-run --no-git-checks
          else
            echo "Publishing packages to npm registry..."
            pnpm -r --filter "./packages/*" publish --access public --no-git-checks
          fi
