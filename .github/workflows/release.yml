# Release and publish workflow for the Agentic SDLC Kit.
#
# SECURITY.md §6: GitHub Actions are pinned to full SHAs (not @v4) to
# defend against supply-chain tampering of the action ref.
#
# Triggers:
#   - Publishing a GitHub Release. The only trigger that publishes. A bare tag
#     push does not, so one release cannot start the publish twice.
#   - Manual trigger (workflow_dispatch). Dry run only: it runs the preflight
#     and a dry-run publish, and refuses a real publish.
#
# scripts/release-preflight.ts runs before verification and fails closed when a
# kit version does not match the tag, when any version is already on npm, or
# when the registry cannot answer.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preflight and simulated publish; the only manual mode)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pin: actions/checkout@v7.0.1 (targets node24).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # Pin: pnpm/action-setup@v6.1.1 (targets node24).
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d
        with:
          version: 12.21.0

      - name: Setup Node 22
        # Pin: actions/setup-node@v7.1.0 (targets node24).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Release preflight (tag, versions, registry)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm exec tsx scripts/release-preflight.ts

      - name: Full verification (architecture, milestones, build, lint, typecheck, test)
        run: pnpm run verify

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running dry-run publish..."
            pnpm -r --filter "./packages/*" publish --access public --dry-run --no-git-checks
          elif [ "$EVENT_NAME" = "release" ]; then
            echo "Publishing packages to npm registry with provenance..."
            pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance
          else
            echo "::error::Manual runs must set dry_run. Only a published release publishes to npm."
            exit 1
          fi
