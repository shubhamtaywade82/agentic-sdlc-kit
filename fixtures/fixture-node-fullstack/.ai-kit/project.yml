# fixture. It is committed alongside the fixture so the kit can validate
# its generator output against it without modifying the fixture.
#
# Commands are argument arrays, never shell strings (CONTRACTS.md §2.1).
# The M6 executor runs them with shell: false.

schemaVersion: 1
name: fixture-node-fullstack
stack:
  - node-typescript
commands:
  test:
    - ["node", "--test", "tests/"]
  # No lint / typecheck / build configured for this fixture (it has no
  # TypeScript compiler, no linter, no build step). The M6 verification
  # runner will report these categories as `skipped`, never `passed`.
